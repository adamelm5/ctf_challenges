<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Hospital Network — laboratoire</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LABORATOIRE LOCAL · MODE SIMULATION</p>
      <h1>Hospital Network</h1>
      <p>Analysez les éléments disponibles et distinguez les faits démontrés des hypothèses.</p>
    </header>
    <section class="progress" aria-live="polite">
      <span id="score">Score : …</span>
      <span id="steps"></span>
    </section>
    <section id="challenge" class="card" aria-live="polite">
      <p>Chargement du scénario…</p>
    </section>
    <p id="notice" role="status"></p>
    <footer>
      Ce parcours est une simulation pédagogique : il ne déclenche aucun exploit, crash ou résolution JNDI.
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
